
services:

  db:
    image: postgres:17
    container_name: olist_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .

    container_name: olist_python

    working_dir: /app

    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./sql:/app/sql:ro

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    ports:
      - "8501:8501"

    depends_on:
      db:
        condition: service_healthy

    command: ["sleep", "infinity"]

volumes:
  postgres_data:
